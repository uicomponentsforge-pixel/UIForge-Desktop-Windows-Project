
name: Build UIForge Desktop for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-desktop/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Windows EXE and MSI
        working-directory: windows-desktop
        run: gradle packageReleaseExe packageReleaseMsi

      - name: Publish EXE and MSI installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1
          name: UIForge Desktop for Windows
          files: |
            windows-desktop/build/compose/binaries/main-release/**/*.exe
            windows-desktop/build/compose/binaries/main-release/**/*.msi
