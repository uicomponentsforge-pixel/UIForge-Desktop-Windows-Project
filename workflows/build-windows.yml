name: Build UIForge Desktop for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-desktop/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Windows EXE and MSI
        working-directory: windows-desktop
        run: gradle packageReleaseExe packageReleaseMsi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: UIForge-Desktop-Windows
          path: windows-desktop/build/compose/binaries/main-release/**
          if-no-files-found: error
